name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs stable + rustfmt + clippy.
      - name: Show toolchain
        run: rustup show active-toolchain --verbose
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The integration tests run `python -m http.server --bind 0.0.0.0`.
      # http.server calls socket.getfqdn() between bind() and listen(); for
      # 0.0.0.0 that resolves the machine's hostname. The runner's hostname
      # is a .local name, resolved via mDNS (not /etc/hosts), which stalls
      # for minutes, so the socket never reaches LISTEN in time. Use a plain
      # hostname that /etc/hosts maps to 127.0.0.1. (Reverse lookups of
      # 127.0.0.1 still take ~35 s here; the tests allow 60 s.)
      - name: Resolve hostname locally (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo scutil --set HostName whatsup-ci
          sudo hostname whatsup-ci
          echo "127.0.0.1 whatsup-ci" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
      - name: Test
        run: cargo test --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit
        run: cargo audit
