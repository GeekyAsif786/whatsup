[package]
name = "whatsup-cli"
version = "0.1.0"
edition = "2024"
description = "See what is listening on your dev machine: ports, dev servers, databases and containers"
license = "MIT"
repository = "https://github.com/GeekyAsif786/whatsup"
readme = "README.md"
homepage = "https://github.com/GeekyAsif786/whatsup"
keywords = ["ports", "tui", "devtools", "docker", "process"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
# sysinfo 0.40 needs 1.95; checked with `cargo +1.95 check --locked --all-targets`.
rust-version = "1.95"
# Source, tests and their snapshots (so `cargo test` works from the crate);
# no CI, docs or packaging. Cargo always adds Cargo.toml and Cargo.lock.
include = ["/src/", "/tests/", "/README.md", "/LICENSE"]

[[bin]]
name = "whatsup"
path = "src/main.rs"

[lib]
name = "whatsup"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
netstat2 = "0.11.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1.49.0"

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "term", "process", "poll"] }
