[package]
name = "whatsup-cli"
version = "0.1.0"
edition = "2024"
description = "See what is listening on your dev machine: ports, dev servers, databases and containers"
license = "MIT"
repository = "https://github.com/GeekyAsif786/whatsup"
readme = "README.md"

[[bin]]
name = "whatsup"
path = "src/main.rs"

[lib]
name = "whatsup"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
netstat2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
